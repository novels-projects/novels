  /api/admin/audit-logs:
    get:
      summary: List admin audit logs
      security:
        - BearerAuth: []
      parameters:
        - {in: query, name: actor_user_id, schema: {type: integer, minimum: 1}}
        - {in: query, name: action, schema: {type: string}}
        - {in: query, name: target_type, schema: {type: string}}
        - {in: query, name: target_id, schema: {type: integer, minimum: 1}}
        - {in: query, name: status, schema: {type: string}}
        - {in: query, name: date_from, schema: {type: string, format: date-time}}
        - {in: query, name: date_to, schema: {type: string, format: date-time}}
        - {in: query, name: page, schema: {type: integer, minimum: 1, default: 1}}
        - {in: query, name: limit, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
      responses:
        '200':
          description: Audit log page
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AuditLogListResponse'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/admin/audit-logs/{id}:
    get:
      summary: Get an admin audit log
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: integer, minimum: 1}
      responses:
        '200':
          description: Audit log detail
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AuditLog'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}

  /api/admin/audit-logs/metadata:
    get:
      summary: Get audit logs filter metadata (actions, target_types, statuses)
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Audit logs metadata options
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AuditLogMetadataResponse'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}

  /writer/{id}:
    get:
      summary: Get public writer profile by writer_id
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: "writer_id (ไม่ใช่ user_id)"
      responses:
        '200':
          description: Writer public profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WriterProfile'
        '404':
          $ref: '#/components/responses/NotFound'

  /writer/{id}/bookshelf-counts:
    get:
      summary: Get bookshelf counts per novel for a writer
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: "writer_id"
      responses:
        '200':
          description: Bookshelf counts per novel
          content:
            application/json:
              schema:
                type: object
                properties:
                  author_id:
                    type: integer
                  novels:
                    type: array
                    items:
                      type: object
        '404':
          $ref: '#/components/responses/NotFound'

  /writer/{id}/total-views:
    get:
      summary: Get total view count across all novels by this writer
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: "writer_id"
      responses:
        '200':
          description: Total view count
          content:
            application/json:
              schema:
                type: object
                properties:
                  author_id:
                    type: integer
                  total_view_count:
                    type: integer
        '404':
          $ref: '#/components/responses/NotFound'

  /api/admin/novels:
    get:
      summary: Admin list novels by moderation status
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: status
          schema:
            type: string
            enum: [all, published, suspended]
            default: all
        - in: query
          name: category_id
          schema:
            type: integer
            minimum: 1
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Paginated novels for admin moderation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminNovelListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/admin/novels/{id}/moderation:
    patch:
      summary: Admin suspend or delete a novel
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  type: string
                  enum: [suspend, delete]
                reason:
                  type: string
      responses:
        '200':
          description: Novel moderation action completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/admin/reports:
    get:
      summary: Admin list reports and appeals
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [all, pending, resolved, rejected, appeal_pending]
            default: all
        - in: query
          name: type
          schema:
            type: string
            enum: [all, report, appeal]
            default: all
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Paginated reports and appeals
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/admin/reports/{id}/status:
    patch:
      summary: Admin update report or appeal status
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status, reason]
              properties:
                status:
                  type: string
                  enum: [resolved, rejected]
                reason:
                  type: string
                  minLength: 1
      responses:
        '200':
          description: Report status updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/admin/novels/{id}/unban:
    patch:
      summary: Admin unban a novel
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Novel unbanned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    BadRequest:
      description: Bad Request Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Unauthorized Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Forbidden Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource Not Found Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Resource Conflict Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    SuccessResponse:
      type: object
      required: [status, message]
      properties:
        status:
          type: integer
        message:
          type: string
        data:
          nullable: true

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: BAD_REQUEST
            message:
              type: string
              example: Invalid input payload

    MessageResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string

    ReportListResponse:
      type: object
      required: [reports, page, limit, total]
      properties:
        reports:
          type: array
          items:
            $ref: '#/components/schemas/ReportResponse'
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer

    ReportResponse:
      type: object
      required: [report_id, user_id, novel_id, reason, status, created_at, novel_cover, novel_synopsis, author_pen_name, author_user_id]
      properties:
        report_id:
          type: integer
        user_id:
          type: integer
        username:
          type: string
        novel_id:
          type: integer
        novel_title:
          type: string
        reason:
          type: string
        report_type:
          type: string
          enum: [report, appeal]
        status:
          type: string
          enum: [pending, resolved, rejected, appeal_pending]
        created_at:
          type: string
          format: date-time
        novel_cover:
          type: string
        novel_synopsis:
          type: string
        author_pen_name:
          type: string
        author_user_id:
          type: integer

    Book:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        active_loan_id:
          type: integer
          nullable: true

    User:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [reader, writer, admin]

    Category:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string

    Novel:
      type: object
      properties:
        novel_id:
          type: integer
        title:
          type: string
        captions:
          type: string
        introduction:
          type: string
        cover_image:
          type: string
        status:
          type: string
          enum: [draft, published, suspended]
        is_published:
          type: boolean
        is_completed:
          type: boolean
        is_banned:
          type: boolean
        ban_reason:
          type: string
        author_id:
          type: integer
        author_name:
          type: string
        pen_name:
          type: string
        views:
          type: integer
        chapter_count:
          type: integer
        scene_count:
          type: integer
        like_count:
          type: integer
        bookshelf_count:
          type: integer

    AdminNovelListResponse:
      type: object
      required: [novels, page, limit, total]
      properties:
        novels:
          type: array
          items:
            $ref: '#/components/schemas/AdminNovel'
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer

    AdminNovel:
      type: object
      required: [novel_id, title, status, is_published, is_completed, author_id]
      properties:
        novel_id:
          type: integer
        title:
          type: string
        captions:
          type: string
          nullable: true
        introduction:
          type: string
          nullable: true
        cover_image:
          type: string
          nullable: true
        status:
          type: string
          enum: [published, suspended]
        is_published:
          type: boolean
        is_completed:
          type: boolean
        author_id:
          type: integer
        author_name:
          type: string
        pen_name:
          type: string
        categories:
          type: array
          items:
            $ref: '#/components/schemas/Category'

    Chapter:
      type: object
      properties:
        id:
          type: integer
        novel_id:
          type: integer
        title:
          type: string
        order_index:
          type: integer

    Scene:
      type: object
      properties:
        id:
          type: integer
        chapter_id:
          type: integer
        title:
          type: string
        content:
          type: string
        image_url:
          type: string
        is_ending:
          type: boolean
        ending_type:
          type: string
        ending_title:
          type: string
        ending_description:
          type: string

    Choice:
      type: object
      properties:
        id:
          type: integer
        from_scene_id:
          type: integer
        to_scene_id:
          type: integer
        choice_text:
          type: string

    SceneNode:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
        data:
          type: object

    ChoiceEdge:
      type: object
      properties:
        id:
          type: string
        source:
          type: string
        target:
          type: string
        label:
          type: string

    ReadingProgress:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        novel_id:
          type: integer
        current_scene_id:
          type: integer

    ReadingHistory:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        novel_id:
          type: integer
        scene_id:
          type: integer
        choice_id:
          type: integer
        created_at:
          type: string

    NotificationSettings:
      type: object
      required: [in_app_notifications, novel_updates, comments, likes, follows]
      properties:
        in_app_notifications:
          type: boolean
        novel_updates:
          type: boolean
        comments:
          type: boolean
        likes:
          type: boolean
        follows:
          type: boolean

    AuthResponse:
      type: object
      description: "Response จาก Login และ Register"
      properties:
        token:
          type: string
          description: "JWT Access Token"
        refresh_token:
          type: string
          description: "JWT Refresh Token"
        user:
          type: object
          properties:
            id:
              type: integer
            username:
              type: string
            email:
              type: string
            pic_profile:
              type: string
            role:
              type: string
              enum: [reader, writer, admin]

    WriterProfile:
      type: object
      description: "โปรไฟล์นักเขียน (public)"
      properties:
        writer_id:
          type: integer
        user_id:
          type: integer
        username:
          type: string
        name_lastname:
          type: string
        pen_name:
          type: string
        bio:
          type: string
        email_writer:
          type: string
        contact_info:
          type: object
          description: "JSON object บันทึกช่องทางติดต่อ"
          properties:
            contact_required:
              type: string
              description: "ช่องทางติดต่อหลัก (primary_contact สำหรับ Apply, contact_required สำหรับ UpdateProfile)"
            contact_optional:
              type: string
              description: "ช่องทางติดต่อเพิ่มเติม"
        avatar_url:
          type: string
        status:
          type: string
          enum: [pending, approved, rejected]
        follower_count:
          type: integer
        total_like_count:
          type: integer
        total_view_count:
          type: integer
        categories:
          type: array
          items:
            $ref: '#/components/schemas/Category'
        applied_at:
          type: string
          format: date-time
        approved_at:
          type: string
          format: date-time

    AuditLog:
      type: object
      required: [log_id, actor_role, action, status, metadata, created_at]
      properties:
        log_id: {type: integer, format: int64}
        actor_user_id: {type: integer, nullable: true}
        actor_username: {type: string, nullable: true}
        actor_role: {type: string}
        action: {type: string}
        target_type: {type: string, nullable: true}
        target_id: {type: integer, format: int64, nullable: true}
        target_name: {type: string, nullable: true}
        status: {type: string}
        ip_address: {type: string, nullable: true}
        metadata: {type: object, additionalProperties: true}
        created_at: {type: string, format: date-time}

    AuditLogListResponse:
      type: object
      required: [items, page, limit, total]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/AuditLog'}
        page: {type: integer}
        limit: {type: integer}
        total: {type: integer}

    AuditLogMetadataResponse:
      type: object
      required: [actions, target_types, statuses]
      properties:
        actions:
          type: array
          items: {type: string}
        target_types:
          type: array
          items: {type: string}
        statuses:
          type: array
          items: {type: string}

