          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/admin/writers/reject:
    post:
      summary: Admin reject writer application
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: writer_id
          required: true
          schema:
            type: integer
