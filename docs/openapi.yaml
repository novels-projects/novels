      responses:
        '200':
          description: Writer application rejected
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /upload/image:
    post:
      summary: Upload image file to MinIO storage
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
